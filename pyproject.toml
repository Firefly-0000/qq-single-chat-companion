[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "qq-autoreply"
version = "2.0.0"
description = "Single-conversation QQ companion assistant using UI Automation and DeepSeek"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "Pillow>=11.0,<13",
  "PySide6>=6.11,<7",
  "keyring>=25.6,<26",
  "mss>=10.1,<11",
  "numpy>=2.2,<3",
  "openai>=3.19,<4",
  "opencv-python>=4.11,<5",
  "onnxruntime>=1.20,<2",
  "platformdirs>=4.3,<5",
  "pydantic>=2.11,<3",
  "pywinauto>=0.6.9,<1",
  "pywin32>=311; sys_platform == 'win32'",
  "rapidocr>=3.9,<4",
]

[project.optional-dependencies]
test = [
  "pytest>=8.4,<9",
  "pytest-cov>=7.0,<8",
  "ruff>=0.14,<0.15",
]

[project.scripts]
qq-autoreply = "qq_autoreply.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/qq_autoreply"]

[tool.hatch.build]
exclude = [
  "/.venv",
  "/data",
  "/dist",
  "/logs",
  "/releases",
  "/work",
  "**/__pycache__",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
  ".agents/skills",
  "src/qq_autoreply/skills/goutoujunshi/references",
  "src/qq_autoreply/skills/goutoujunshi/scripts",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
